<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Namma Kolara – Explore Services</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="services.css"
    >
</head>

<body>

    <!-- NAVBAR -->
    <nav
        class="navbar"
        role="navigation"
        aria-label="Main navigation"
    >

        <a
            href="../index.html#home"
            class="logo"
        >
            <img
                src="../assets/logo.png"
                alt="Namma Kolar logo"
            >
        </a>

        <div class="nav-links">

            <a href="../index.html#home">Home</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#explore">Explore</a>
            <a href="../index.html#updates">Updates</a>
            <a href="../index.html#events">Events</a>
            <a href="../index.html#contact">Contact Us</a>

        </div>

        <a
            href="../index.html#report"
            class="report-btn"
        >
            Report Problem
        </a>

        <button
            class="menu-toggle"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <!-- MOBILE MENU -->
        <div
            class="mobile-menu"
            aria-hidden="true"
        >

            <button
                class="close-menu"
                aria-label="Close navigation menu"
            >
                ✕
            </button>

            <ul>

                <li>
                    <a href="../index.html#home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="../index.html#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="../index.html#explore">
                        Explore
                    </a>
                </li>

                <li>
                    <a href="../index.html#updates">
                        Updates
                    </a>
                </li>

                <li>
                    <a href="../index.html#events">
                        Events
                    </a>
                </li>

                <li>
                    <a href="../index.html#contact">
                        Contact Us
                    </a>
                </li>

            </ul>

            <a
                href="../index.html#report"
                class="mobile-report-btn"
            >
                Report Problem
            </a>

        </div>

    </nav>


    <!-- MAIN -->
    <main>

        <!-- INTRO -->
        <div class="service-intro">

            <div class="eyebrow">
                Explore Services
            </div>

            <h1>
                What are you looking for?
            </h1>

            <p>
                Find essential services, facilities and support across Kolar district.
            </p>

        </div>


        <!-- SERVICES -->
        <div class="wrap">

            <div
                class="tabs"
                role="tablist"
                id="tabs"
            ></div>

            <section
                class="panel"
                id="panel"
                role="tabpanel"
                aria-live="polite"
            ></section>

        </div>

    </main>


    <script src="services.js"></script>

</body>

</html>
